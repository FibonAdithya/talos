# THROWAWAY PROBE, never merged: does `talos` resolve on Windows after a uv + Python 3.14 install?
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install uv, venv on 3.14, editable install
        shell: pwsh
        run: |
          python -m pip install uv
          uv venv --python 3.14 .venv
          uv pip install --python .venv\Scripts\python.exe -e .
          .venv\Scripts\python.exe --version
      - name: pwsh 7 - what is in Scripts, direct exe
        shell: pwsh
        run: |
          Get-ChildItem .venv\Scripts | Select-Object Name, Length | Format-Table -AutoSize
          .venv\Scripts\talos.exe --help; "PROBE direct exe exit=$LASTEXITCODE"
          Get-Command talos -ErrorAction SilentlyContinue; "PROBE before activate found=$([bool](Get-Command talos -ErrorAction SilentlyContinue))"
          .venv\Scripts\Activate.ps1
          "PROBE after activate found=$([bool](Get-Command talos -ErrorAction SilentlyContinue))"
          talos --help; "PROBE pwsh talos exit=$LASTEXITCODE"
          Get-ExecutionPolicy -List
      - name: Windows PowerShell 5.1 - activate then talos
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .venv\Scripts\Activate.ps1
          "PROBE ps51 after activate found=$([bool](Get-Command talos -ErrorAction SilentlyContinue))"
          talos --help; "PROBE ps51 talos exit=$LASTEXITCODE"
