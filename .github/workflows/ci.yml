# Runs the gate on every pull request and on every push to main.
#
# The push-to-main trigger is not redundant with the PR one: a direct push
# reaches main without a PR and would otherwise arrive with nothing having
# run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow reads code and runs tests. Nothing it does
# needs a token that can write.
permissions:
  contents: read

# A second push to the same ref makes the in-flight run answer a question
# nobody is asking any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Talos runs on the user's own machine, so the gate runs on each OS a user might have.
    # fail-fast off: one OS failing must not cancel the runs that say whether the others pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # bash on every OS (Git Bash on Windows), so the install step's shell syntax works there too.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the toolchain and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if grep -q '^\[project\]' pyproject.toml 2>/dev/null; then python -m pip install -e .; fi

      - name: Run the gate
        # setup-python provides `python` on every OS, but no `python3` on Windows.
        run: make check PYTHON=python
