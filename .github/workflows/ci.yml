# Runs the gate on every pull request and on every push to main.
#
# The push-to-main trigger is not redundant with the PR one: a direct push
# reaches main without a PR and would otherwise arrive with nothing having
# run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow reads code and runs tests. Nothing it does
# needs a token that can write.
permissions:
  contents: read

# A second push to the same ref makes the in-flight run answer a question
# nobody is asking any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Talos runs on the user's own machine, so the gate runs on each OS a user might have.
    # fail-fast off: one OS failing must not cancel the runs that say whether the others pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # bash on every OS (Git Bash on Windows), so the install step's shell syntax works there too.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the toolchain and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if grep -q '^\[project\]' pyproject.toml 2>/dev/null; then python -m pip install -e ".[all]"; fi

      - name: Run the gate
        # setup-python provides `python` on every OS, but no `python3` on Windows.
        run: make check PYTHON=python

  # The clone install above does not prove the wheel is complete: a file the job containers or the
  # Modal app read can exist in the clone and be missing from the wheel. This job installs the built
  # wheel with no extras and runs it from an empty directory.
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6.8.0

      - name: Build the wheel, check its contents, install it with no extras
        run: |
          uv build
          python scripts/check_wheel.py dist/*.whl
          uv tool install --python 3.12 dist/*.whl
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Default workspace under a fresh home
        # Temporary directories come from Python: on Windows, Git Bash's `mktemp` returns a /tmp/...
        # path that is not translated when it reaches USERPROFILE, which Path.home() reads there.
        # end="" because Windows python prints \r\n and $(...) strips only the \n, which would
        # leave a stray \r in the path.
        run: |
          fake_home="$(python -c "import tempfile; print(tempfile.mkdtemp(), end=\"\")")"
          empty_dir="$(python -c "import tempfile; print(tempfile.mkdtemp(), end=\"\")")"
          export HOME="$fake_home" USERPROFILE="$fake_home"
          cd "$empty_dir"
          talos --version
          talos demo --delay 0
          talos status --json | python -c "import json,sys; from pathlib import Path; jobs=json.load(sys.stdin)['jobs']; assert len(jobs)==1 and jobs[0]['status']=='won', jobs; d=Path.home()/'.talos'/'workspace'/'runs'/jobs[0]['job_id']; assert d.is_dir(), d"

      - name: TALOS_WORKSPACE overrides the default
        run: |
          fake_home="$(python -c "import tempfile; print(tempfile.mkdtemp(), end=\"\")")"
          empty_dir="$(python -c "import tempfile; print(tempfile.mkdtemp(), end=\"\")")"
          workspace="$(python -c "import tempfile; print(tempfile.mkdtemp(), end=\"\")")"
          export HOME="$fake_home" USERPROFILE="$fake_home" TALOS_WORKSPACE="$workspace"
          cd "$empty_dir"
          talos demo --delay 0
          python -c "import os; from pathlib import Path; r=Path(os.environ['TALOS_WORKSPACE'])/'runs'; n=[p for p in r.iterdir() if p.is_dir()]; assert len(n)==1, n; d=Path.home()/'.talos'/'workspace'; assert not d.exists(), d"
