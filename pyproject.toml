[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos-tig"
version = "0.1.0"
description = "Single-user autoresearch loop for TIG challenges"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["modal>=1.5,<2", "rich>=13", "anthropic>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
talos = "talos.cli:main"

[tool.setuptools]
packages = ["talos", "talos.providers", "modal_app"]

[tool.setuptools.package-data]
talos = ["data/*.md"]

[tool.pytest.ini_options]
markers = ["live: hits Modal or the network; run manually"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
